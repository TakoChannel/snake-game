<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Snake App</title>
    
    <!-- Cấu hình để thiết bị nhận diện đây là Web App trên di động -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --accent-color: #22c55e;
            --text-color: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: var(--panel-color);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            max-width: 100%;
        }
        h1 { margin-bottom: 5px; font-size: 20px; color: var(--accent-color); }
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        canvas {
            background-color: #000;
            border: 3px solid #334155;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
            touch-action: none; /* Ngăn cuộn trang khi vuốt trên màn hình game */
        }
        .btn-restart {
            margin-top: 10px;
            padding: 8px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        /* Bàn phím ảo hỗ trợ chơi trên điện thoại */
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }
        .control-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        .control-btn:active { background: var(--accent-color); }
        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; }
        .btn-down { grid-column: 2; }
        .btn-right { grid-column: 3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SNAKE PWA</h1>
        <div class="score-board">
            <div>Điểm: <span id="score">0</span></div>
            <div>Cao nhất: <span id="highScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        
        <button id="restartBtn" class="btn-restart" onclick="resetGame()">Chơi lại</button>
        
        <!-- Các nút điều hướng trên màn hình cảm ứng -->
        <div class="mobile-controls">
            <button class="control-btn btn-up" onclick="setDir('UP')">⬆️</button>
            <button class="control-btn btn-left" onclick="setDir('LEFT')">⬅️</button>
            <button class="control-btn btn-down" onclick="setDir('DOWN')">⬇️</button>
            <button class="control-btn btn-right" onclick="setDir('RIGHT')">➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const grid = 20;
        let count = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_pwa_high") || 0;
        document.getElementById("highScore").innerText = highScore;

        let snake = [
            { x: 140, y: 140 },
            { x: 120, y: 140 },
            { x: 100, y: 140 }
        ];
        let dx = grid;
        let dy = 0;
        let food = { x: 260, y: 260 };
        let isGameOver = false;

        // Bắt sự kiện bàn phím máy tính
        document.addEventListener("keydown", e => {
            if([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
            if (e.keyCode === 37) setDir('LEFT');
            if (e.keyCode === 38) setDir('UP');
            if (e.keyCode === 39) setDir('RIGHT');
            if (e.keyCode === 40) setDir('DOWN');
        });

        // Xử lý vuốt cảm ứng trên màn hình điện thoại
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            // Kiểm tra hướng vuốt nào có lực kéo lớn hơn
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) setDir('RIGHT');
                else setDir('LEFT');
            } else {
                if (diffY > 0) setDir('DOWN');
                else setDir('UP');
            }

            touchStartX = 0;
            touchStartY = 0;
            e.preventDefault();
        }, { passive: false });

        function setDir(direction) {
            const goingUp = dy === -grid;
            const goingDown = grid === dy;
            const goingRight = dx === grid;
            const goingLeft = dx === -grid;

            if (direction === 'LEFT' && !goingRight) { dx = -grid; dy = 0; }
            if (direction === 'UP' && !goingDown)  { dx = 0; dy = -grid; }
            if (direction === 'RIGHT' && !goingLeft)  { dx = grid; dy = 0; }
            if (direction === 'DOWN' && !goingUp)    { dx = 0; dy = grid; }
        }

        function gameLoop() {
            if (isGameOver) return;
            requestAnimationFrame(gameLoop);

            // Điều chỉnh tốc độ: tăng từ 6 lên 10 để con rắn di chuyển chậm rãi hơn
            if (++count < 10) return;
            count = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawFood();
            moveSnake();
            drawSnake();
            checkGameOver();
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snake_pwa_high", highScore);
                    document.getElementById("highScore").innerText = highScore;
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#22c55e" : "#4ade80";
                ctx.fillRect(part.x, part.y, grid - 2, grid - 2);
            });
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(food.x, food.y, grid - 2, grid - 2);
        }

        function checkGameOver() {
            const head = snake[0];
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame();
            }
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) endGame();
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById("restartBtn").style.display = "inline-block";
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            ctx.font = "22px Segoe UI";
            ctx.textAlign = "center";
            ctx.fillText("THUA RỒI!", canvas.width / 2, canvas.height / 2 - 10);
        }

        function resetGame() {
            score = 0;
            document.getElementById("score").innerText = score;
            snake = [{ x: 140, y: 140 }, { x: 120, y: 140 }, { x: 100, y: 140 }];
            dx = grid; dy = 0;
            isGameOver = false;
            document.getElementById("restartBtn").style.display = "none";
            generateFood();
            gameLoop();
        }

        // Đăng ký Service Worker để biến thành PWA chạy offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        generateFood();
        gameLoop();
    </script>
</body>
</html>
